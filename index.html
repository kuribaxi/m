:root {
  --bg: #0b1220;
  --bg-alt: #0f1830;
  --panel: #121b2e;
  --panel-line: rgba(212, 175, 55, 0.16);
  --gold: #c9a227;
  --gold-bright: #e8c766;
  --cream: #f3ecdd;
  --cream-dim: #a9a290;
  --teal: #35c6b4;
  --green: #2f8f7f;
  --green-light: #4ec9b0;
  --blue: #3b82f6;
  --blue-light: #60a5fa;
  --error: #e2574c;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body, .app-root {
  background: radial-gradient(700px 400px at 15% -10%, rgba(201, 162, 39, 0.10), transparent),
              radial-gradient(900px 500px at 90% 10%, rgba(53, 198, 180, 0.06), transparent),
              var(--bg);
  color: var(--cream);
  font-family: 'Manrope', sans-serif;
  min-height: 100vh;
}
.app-root { padding: 20px 0 120px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.header {
  text-align: center;
  padding: 30px 20px 20px;
  border-bottom: 1px solid var(--panel-line);
  margin-bottom: 30px;
  background: linear-gradient(180deg, rgba(201, 162, 39, 0.06), transparent);
}
.header h1 {
  font-family: 'Fraunces', serif;
  font-weight: 900;
  font-size: clamp(28px, 5vw, 42px);
  color: var(--cream);
}
.header h1 span { color: var(--gold-bright); }
.header p {
  margin-top: 8px;
  font-size: 14px;
  color: var(--cream-dim);
  max-width: 600px;
  margin-left: auto; margin-right: auto;
  line-height: 1.6;
}
.bulbs { display: flex; justify-content: center; gap: 7px; margin-bottom: 16px; }
.bulb {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold-bright);
  box-shadow: 0 0 6px 1px rgba(232, 199, 102, 0.6);
  animation: flicker 3.2s ease-in-out infinite;
}
.bulb:nth-child(3n) { animation-delay: .4s; }
.bulb:nth-child(5n) { animation-delay: .9s; }
.bulb:nth-child(7n) { animation-delay: 1.4s; }
@keyframes flicker { 0%,100%{opacity:1} 50%{opacity:.35} }

.search-wrapper {
  display: flex; gap: 10px; max-width: 700px; margin: 16px auto 12px;
  align-items: center; flex-wrap: wrap; justify-content: center;
  position: relative; z-index: 5;
}
.search-box {
  flex: 1; min-width: 180px; padding: 12px 16px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--panel-line);
  color: var(--cream); border-radius: 10px; font-size: 14px;
  font-family: 'Manrope', sans-serif; outline: none;
  transition: border-color 0.15s; position: relative; z-index: 5;
}
.search-box:focus { border-color: var(--gold); }
.search-box.vkb-active { border-color: var(--gold); box-shadow: 0 0 20px rgba(201,162,39,0.1); opacity: 0.7; }
.search-btn {
  background: var(--blue); color: #fff; border: none; font-weight: 700; font-size: 13px;
  padding: 12px 24px; border-radius: 10px; cursor: pointer;
  transition: background .15s, transform .1s; font-family: 'Manrope', sans-serif;
  white-space: nowrap; position: relative; z-index: 5;
}
.search-btn:hover { background: var(--blue-light); }
.search-btn:active { transform: scale(0.98); }
.vkb-toggle-btn {
  background: var(--panel); border: 1px solid var(--panel-line); color: var(--cream-dim);
  border-radius: 10px; padding: 10px 16px; font-size: 12px;
  font-family: 'JetBrains Mono', monospace; cursor: pointer; transition: all .15s;
  white-space: nowrap; position: relative; z-index: 5;
}
.vkb-toggle-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
.vkb-toggle-btn.active { background: var(--gold); color: #1a1305; border-color: var(--gold); font-weight: 700; }

.stats {
  display: flex; justify-content: center; gap: 10px; margin: 16px 0 24px;
  font-size: 12px; color: var(--cream-dim); font-family: 'JetBrains Mono', monospace;
  flex-wrap: wrap; position: relative; z-index: 5;
}
.stats span { background: var(--panel); padding: 6px 14px; border-radius: 20px; border: 1px solid var(--panel-line); }
.stats strong { color: var(--gold-bright); }

.section-title {
  font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px;
  color: var(--gold-bright); margin: 30px 0 14px; padding-bottom: 8px;
  border-bottom: 2px solid var(--panel-line);
}
.section-title .badge {
  font-size: 12px; font-family: 'Manrope', sans-serif; font-weight: 400;
  color: var(--cream-dim); background: var(--panel); padding: 2px 12px; border-radius: 20px; margin-left: 10px;
}
.site-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 30px; }
.site-card {
  background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius);
  padding: 16px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer;
  transition: all 0.2s ease; text-decoration: none; color: var(--cream);
}
.site-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
.site-card.biologi { border-left: 4px solid var(--green-light); }
.site-card.verktyg { border-left: 4px solid var(--blue-light); }
.site-card.tv { border-left: 4px solid #cc5555; }
.site-card.noje { border-left: 4px solid var(--gold); }
.site-card.biologi:hover, .site-card.verktyg:hover, .site-card.tv:hover, .site-card.noje:hover { border-left-color: var(--gold); }

.site-icon { font-size: 24px; flex-shrink: 0; width: 40px; text-align: center; }
.site-info { flex: 1; min-width: 0; }
.site-name { font-size: 14px; font-weight: 600; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-desc { font-size: 11px; color: var(--cream-dim); margin-top: 3px; font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.site-type { font-size: 10px; font-family: 'JetBrains Mono', monospace; color: var(--cream-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; display:flex; align-items:center; gap:4px; }
.site-type .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; }
.site-type .dot.green { background: var(--green-light); }
.site-type .dot.blue { background: var(--blue-light); }
.site-type .dot.red { background: #cc5555; }
.site-type .dot.gold { background: var(--gold); }
.site-arrow { font-size: 18px; color: var(--cream-dim); flex-shrink: 0; transition: all 0.2s; }
.site-card:hover .site-arrow { color: var(--gold-bright); transform: translateX(3px); }

.footer { text-align: center; font-size: 12px; color: var(--cream-dim); opacity: 0.6; padding: 30px 20px 10px; border-top: 1px solid var(--panel-line); margin-top: 20px; position: relative; z-index: 5; }
.footer a { color: var(--gold-bright); text-decoration: none; }

.clock-badge {
  position: fixed; top: 14px; right: 14px; z-index: 9999;
  background: rgba(18, 27, 46, 0.92); border: 1px solid var(--panel-line); border-radius: 12px;
  padding: 8px 12px; backdrop-filter: blur(10px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.35), 0 0 0 1px rgba(201,162,39,0.08) inset;
  pointer-events: none; text-align: right; min-width: 118px;
}
.clock-time { font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 700; color: var(--gold-bright); line-height: 1; letter-spacing: 0.02em; }
.clock-date { font-family: 'Manrope', sans-serif; font-size: 10.5px; color: var(--cream-dim); margin-top: 3px; text-transform: capitalize; line-height: 1.2; }
.clock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--teal); display: inline-block; margin-right: 6px; box-shadow: 0 0 6px var(--teal); animation: blink 1.5s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }

/* VKB */
.vkb-wrap { display: none; width: 100%; max-width: 800px; margin: 10px auto 0; padding: 0 10px; z-index: 20; position: relative; }
.vkb-wrap.open { display: block !important; }
.vkb-panel {
  width: 100%; background: #3a3d42; border: 2px solid #4a4d52; border-radius: 16px;
  padding: 14px 16px 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
}
.vkb-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.vkb-title { font-size: 11px; font-family: 'JetBrains Mono', monospace; color: var(--gold-bright); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 700; }
.vkb-head-right { display: flex; gap: 8px; align-items: center; }
.vkb-mode-btn {
  font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 4px 10px; border-radius: 8px;
  border: 2px solid #4a4d52; background: #4a4d52; color: #e0e0e5; cursor: pointer; transition: all .15s; font-weight: 600;
}
.vkb-mode-btn:hover { background: #5a5d62; color: #fff; }
.vkb-close {
  width: 22px; height: 22px; border-radius: 8px; background: #4a4d52; border: 2px solid #5a5d62;
  color: #e0e0e5; display: flex; align-items: center; justify-content: center; cursor: pointer;
  font-size: 16px; font-weight: 700; transition: all .15s;
}
.vkb-close:hover { background: var(--error); color: #fff; border-color: var(--error); }
.vkb-langs { display: flex; gap: 4px; margin-bottom: 8px; }
.vkb-lang {
  font-size: 10px; font-family: 'JetBrains Mono', monospace; padding: 4px 10px; border-radius: 8px;
  border: 2px solid #4a4d52; background: #4a4d52; color: #e0e0e5; cursor: pointer; transition: all .15s; font-weight: 600;
}
.vkb-lang:hover { background: #5a5d62; color: #fff; border-color: #6a6d72; }
.vkb-lang.active { background: var(--gold); color: #1a1305; border-color: var(--gold); font-weight: 700; }
.vkb-rows { display: flex; flex-direction: column; gap: 5px; }
.vkb-row { display: flex; gap: 5px; justify-content: center; }
.vkb-key {
  min-width: 38px; height: 30px; padding: 0 6px;
  background: linear-gradient(180deg, #5a5d62 0%, #4a4d52 100%);
  border: 2px solid #6a6d72; border-radius: 8px; color: #fff; font-size: 16px; font-weight: 700;
  font-family: 'Manrope', sans-serif; display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: background .15s, border-color .15s; user-select: none; flex: 1;
  box-shadow: 0 3px 0 #3a3d42, 0 4px 8px rgba(0,0,0,0.3); text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  position: relative; overflow: hidden;
}
.vkb-key::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 35%;
  background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent); border-radius: 6px 6px 0 0; pointer-events: none;
}
.vkb-key:hover { background: linear-gradient(180deg, #6a6d72 0%, #5a5d62 100%); border-color: #8a8d92; }
.vkb-key:active { transform: translateY(2px); box-shadow: 0 1px 0 #3a3d42, 0 2px 4px rgba(0,0,0,0.3); }
.vkb-key.wide { min-width: 55px; flex: 1.5; font-size: 12px; font-family: 'JetBrains Mono', monospace; }
.vkb-key.space { flex: 4; }
.vkb-key.enter { background: linear-gradient(180deg, #3cb371 0%, #2e8b57 100%); border-color: #4cd581; color: #fff; box-shadow: 0 3px 0 #1e6b3a, 0 4px 8px rgba(0,0,0,0.3); }
.vkb-key.enter:hover { background: linear-gradient(180deg, #4cd581 0%, #3cb371 100%); border-color: #5ce591; }
.vkb-key.back { background: linear-gradient(180deg, #c44 0%, #a33 100%); border-color: #d55; color: #fff; box-shadow: 0 3px 0 #822, 0 4px 8px rgba(0,0,0,0.3); }
.vkb-key.back:hover { background: linear-gradient(180deg, #d55 0%, #c44 100%); border-color: #e66; }

.vkb-wrap.light .vkb-panel { background: #d4d6da; border-color: #b4b6ba; box-shadow: 0 20px 60px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.8); }
.vkb-wrap.light .vkb-key { background: linear-gradient(180deg, #f0f0f4 0%, #d8d8dc 100%); border-color: #c0c0c8; color: #2a2d32; box-shadow: 0 3px 0 #b4b6ba, 0 4px 8px rgba(0,0,0,0.15); text-shadow: none; }
.vkb-wrap.light .vkb-key::before { background: linear-gradient(180deg, rgba(255,255,255,0.6), transparent); }
.vkb-wrap.light .vkb-key:hover { background: linear-gradient(180deg, #fff 0%, #e8e8ec 100%); border-color: #a0a0a8; }
.vkb-wrap.light .vkb-key:active { box-shadow: 0 1px 0 #b4b6ba, 0 2px 4px rgba(0,0,0,0.15); }
.vkb-wrap.light .vkb-key.enter { background: linear-gradient(180deg, #3cb371 0%, #2e8b57 100%); border-color: #4cd581; color: #fff; box-shadow: 0 3px 0 #1e6b3a, 0 4px 8px rgba(0,0,0,0.2); }
.vkb-wrap.light .vkb-key.back { background: linear-gradient(180deg, #c44 0%, #a33 100%); border-color: #d55; color: #fff; box-shadow: 0 3px 0 #822, 0 4px 8px rgba(0,0,0,0.2); }
.vkb-wrap.light .vkb-lang { background: #c0c0c8; border-color: #b0b0b8; color: #2a2d32; }
.vkb-wrap.light .vkb-lang:hover { background: #d0d0d8; border-color: #a0a0a8; }
.vkb-wrap.light .vkb-mode-btn { background: #c0c0c8; border-color: #b0b0b8; color: #2a2d32; }
.vkb-wrap.light .vkb-mode-btn:hover { background: #d0d0d8; }
.vkb-wrap.light .vkb-close { background: #c0c0c8; border-color: #b0b0b8; color: #2a2d32; }
.vkb-wrap.light .vkb-close:hover { background: var(--error); color: #fff; border-color: var(--error); }

.vkb-blocker { display: none; position: fixed; top:0; left:0; right:0; bottom:0; z-index: 15; background: transparent; cursor: default; }
.vkb-blocker.active { display: block; }

/* MUSIC PLAYER */
.music-player {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: rgba(11, 18, 32, 0.97); border-top: 1px solid var(--panel-line);
  backdrop-filter: blur(16px); box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
  padding: 10px 20px; display: flex; align-items: center; gap: 14px;
  transition: transform .3s ease, opacity .3s ease;
}
.music-player.hidden-player { transform: translateY(100%); opacity: 0; pointer-events: none; }
.music-player-left { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.music-play-btn {
  width: 38px; height: 38px; border-radius: 50%; background: var(--gold); border: none; color: #1a1305;
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s; font-size: 16px;
}
.music-play-btn:hover { background: var(--gold-bright); transform: scale(1.05); }
.music-track-info { min-width: 0; }
.music-track-title { font-size: 12px; font-weight: 600; color: var(--cream); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; }
.music-track-station { font-size: 10px; color: var(--cream-dim); font-family: 'JetBrains Mono', monospace; }
.music-player-center { flex: 1; display: flex; align-items: center; gap: 12px; min-width: 0; }
.music-volume { display: flex; align-items: center; gap: 6px; }
.music-volume input[type=range] { width: 80px; height: 3px; -webkit-appearance: none; appearance: none; background: var(--panel-line); border-radius: 2px; outline: none; }
.music-volume input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); cursor: pointer; }
.music-volume input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--gold); cursor: pointer; border: none; }
.music-visualizer { display: flex; align-items: flex-end; gap: 2px; height: 20px; }
.music-bar { width: 3px; background: var(--gold-bright); border-radius: 2px; animation: music-bounce 1s ease-in-out infinite; }
.music-bar:nth-child(1){height:6px; animation-delay:0s} .music-bar:nth-child(2){height:12px; animation-delay:.1s}
.music-bar:nth-child(3){height:8px; animation-delay:.2s} .music-bar:nth-child(4){height:14px; animation-delay:.15s}
.music-bar:nth-child(5){height:10px; animation-delay:.05s} .music-bar:nth-child(6){height:16px; animation-delay:.25s}
.music-bar:nth-child(7){height:7px; animation-delay:.1s}
@keyframes music-bounce { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.4)} }
.music-player.paused .music-bar { animation-play-state: paused; opacity: 0.3; }
.music-station-select {
  background: #0b1220; border: 1px solid var(--panel-line); color: var(--cream); border-radius: 8px;
  padding: 5px 10px; font-size: 11px; font-family: 'JetBrains Mono', monospace; cursor: pointer; outline: none; max-width: 160px;
}
.music-station-select option { background: #0b1220; color: var(--cream); font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 6px 10px; }
.music-station-select:focus { border-color: var(--gold); }
.music-player-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.music-mute-btn { background: transparent; border: 1px solid var(--panel-line); color: var(--cream-dim); border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all .15s; }
.music-mute-btn:hover { border-color: var(--gold); color: var(--gold-bright); }
.music-close-btn { background: transparent; border: 1px solid var(--panel-line); color: var(--cream-dim); border-radius: 8px; padding: 5px 10px; font-size: 11px; cursor: pointer; font-family: 'JetBrains Mono', monospace; transition: all .15s; }
.music-close-btn:hover { border-color: var(--error); color: var(--error); }
.music-reopen-btn {
  position: fixed; bottom: 14px; right: 14px; z-index: 39; background: var(--gold); color: #1a1305; border: none; border-radius: 50%;
  width: 44px; height: 44px; display: none; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 4px 16px rgba(201,162,39,0.3); transition: all .15s; font-size: 18px;
}
.music-reopen-btn:hover { background: var(--gold-bright); transform: scale(1.05); }
.music-reopen-btn.show { display: flex; }
.music-unmute-hint {
  position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); z-index: 35;
  background: var(--panel); border: 1px solid var(--gold); border-radius: 20px; padding: 8px 18px;
  font-size: 12px; color: var(--gold-bright); display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.3); animation: hint-bounce 2s infinite;
}
.music-unmute-hint.show { display: block; }
@keyframes hint-bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(-4px)} }

.copy-feedback {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--gold); color: #1a1305; padding: 10px 24px; border-radius: 12px; font-weight: 700;
  font-size: 14px; opacity: 0; transition: opacity 0.3s ease; z-index: 100; pointer-events: none;
}
.copy-feedback.show { opacity: 1; }

@media (max-width: 700px) {
  .music-player { flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
  .music-track-title { max-width: 120px; }
  .music-volume input[type=range] { width: 50px; }
  .music-station-select { max-width: 120px; }
  .search-wrapper { flex-direction: column; }
  .search-btn { width: 100%; }
  .vkb-toggle-btn { width: 100%; text-align: center; }
}
@media (max-width: 600px) {
  .clock-badge { top: 14px; left: 12px; right: auto; bottom: auto; padding: 7px 10px; min-width: 102px; }
  .clock-time { font-size: 13.5px; } .clock-date { font-size: 9.5px; }
  .site-grid { grid-template-columns: 1fr; }
  .stats { flex-direction: column; gap: 8px; align-items: center; }
  .vkb-key { min-width: 28px; height: 24px; font-size: 12px; padding: 0 4px; }
  .vkb-key.wide { min-width: 40px; font-size: 10px; }
  .vkb-panel { padding: 10px 10px 12px; }
}
@media (min-width: 601px) and (max-width: 900px) {
  .site-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--panel-line); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--gold); }
